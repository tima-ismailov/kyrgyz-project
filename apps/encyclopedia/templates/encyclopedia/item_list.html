<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог предметов</title>
</head>
<body>

    <h1>Каталог предметов</h1>
    
    <form method="GET">
        <input type="text" name="q" value="{{ query }}" placeholder="Поиск...">
        <select name="category">
            <option value="">Все категории</option>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">🔍</button>
    </form>

    <ul>
        {% for item in items %}
            <li>
                <a href="{{ item.id }}/">{{ item.name }}</a> - {{ item.category }}
            </li>
        {% endfor %}
    </ul>

</body>
</html>
